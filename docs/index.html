<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markets Dashboard</title>
<style>
  :root {
    --bg: #f6f8fa;
    --card-bg: #ffffff;
    --text: #1f2328;
    --muted: #6e7781;
    --border: #d0d7de;
    --green: #1a7f37;
    --red: #d1242f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --green: #3fb950;
      --red: #f85149;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 2px; }
  .updated { color: var(--muted); font-size: 0.85rem; margin: 0 0 24px; }
  h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 28px 0 10px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .name { font-weight: 500; }
  .prices { text-align: right; }
  .price-usd { font-variant-numeric: tabular-nums; }
  .price-mad { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .pct {
    min-width: 84px;
    text-align: right;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pct.up { color: var(--green); }
  .pct.down { color: var(--red); }
  .pct.na { color: var(--muted); font-weight: 400; }
  .state { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Daily Markets Dashboard</h1>
    <p class="updated" id="updated">Loading…</p>

    <h2>Global (USD, MAD equivalent)</h2>
    <div class="card" id="global-card"><div class="state">Loading…</div></div>

    <h2>Morocco / FX</h2>
    <div class="card" id="morocco-card"><div class="state">Loading…</div></div>
  </div>

<script>
function pctSpan(pct) {
  if (pct === null || pct === undefined) {
    return '<span class="pct na">—</span>';
  }
  const dir = pct >= 0 ? 'up' : 'down';
  const arrow = pct >= 0 ? '▲' : '▼';
  const sign = pct >= 0 ? '+' : '';
  return `<span class="pct ${dir}">${arrow} ${sign}${pct.toFixed(2)}%</span>`;
}

function fmt(n) {
  return n === null || n === undefined
    ? null
    : n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderGlobalRow(item) {
  if (item.usd === null || item.usd === undefined) {
    return `<div class="row">
      <div class="name">${item.name}</div>
      <div class="prices"><span class="price-usd">data unavailable</span></div>
    </div>`;
  }
  return `<div class="row">
    <div class="name">${item.name}</div>
    <div class="prices">
      <div class="price-usd">$${fmt(item.usd)}</div>
      <div class="price-mad">${fmt(item.mad)} MAD</div>
    </div>
    ${pctSpan(item.pct)}
  </div>`;
}

function renderFxRow(pair, rate) {
  return `<div class="row">
    <div class="name">${pair}</div>
    <div class="prices"><span class="price-usd">${rate === null ? 'data unavailable' : rate}</span></div>
  </div>`;
}

function renderMasiRow(item) {
  if (item.mad === null || item.mad === undefined) {
    return `<div class="row">
      <div class="name">${item.name} (Casablanca)</div>
      <div class="prices"><span class="price-usd">unavailable</span></div>
    </div>`;
  }
  return `<div class="row">
    <div class="name">${item.name} (Casablanca)</div>
    <div class="prices"><span class="price-usd">${fmt(item.mad)} MAD</span></div>
    ${pctSpan(item.pct)}
  </div>`;
}

fetch('./digest.json', { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(data => {
    const generated = new Date(data.generated_at);
    document.getElementById('updated').textContent =
      'Last updated ' + generated.toLocaleString(undefined, {
        dateStyle: 'full', timeStyle: 'short',
      });

    document.getElementById('global-card').innerHTML =
      data.global.map(renderGlobalRow).join('');

    const fxRows = Object.entries(data.fx).map(([pair, rate]) => renderFxRow(pair, rate)).join('');
    const masiRows = data.masi.map(renderMasiRow).join('');
    document.getElementById('morocco-card').innerHTML = fxRows + masiRows;
  })
  .catch(err => {
    document.getElementById('updated').textContent = '';
    const msg = `<div class="state">Couldn't load digest.json (${err.message}). Has the daily workflow run yet?</div>`;
    document.getElementById('global-card').innerHTML = msg;
    document.getElementById('morocco-card').innerHTML = '';
  });
</script>
</body>
</html>
