name: Daily Markets Digest

on:
  schedule:
    # 07:00 UTC ≈ 08:00 Morocco time (Morocco is UTC+0/+1 depending on DST rules).
    # Adjust the hour below if you want it earlier/later locally.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed to commit the refreshed docs/digest.json

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest and update dashboard data
        run: python digest.py

      - name: Commit updated digest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest.json
          git diff --staged --quiet || git commit -m "Update daily digest data"
          git push
