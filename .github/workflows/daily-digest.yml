name: Markets Digest

on:
  schedule:
    # Every 3 hours. GitHub Actions cron is best-effort and can lag a few
    # minutes at peak load, but this stays well within the free-tier minutes
    # (8 runs/day * well under a minute each).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed to commit the refreshed docs/digest.json

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest and update dashboard data
        run: python digest.py

      - name: Commit updated digest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest.json
          git diff --staged --quiet || git commit -m "Update daily digest data"
          git push
